services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    container_name: lanala-mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "*"
    ports:
      - "5000:5000"
    volumes:
      - ./storage/mlflow:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:5000/health'
          )
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: lanala-api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: lanala-banking-recommender
      MODEL_ALIAS: ${MODEL_ALIAS:-staging}
      TOP_K: "3"
      LABEL_ENCODER_PATH: /app/model-assets/label_encoder.joblib
    ports:
      - "8000:8000"
    volumes:
      - ./reports/phase4/label_encoder.joblib:/app/model-assets/label_encoder.joblib:ro
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/health'
          )
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped