name: lanala-mlops

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    container_name: lanala-mlflow

    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/database/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "*"

    ports:
      - "5000:5000"

    volumes:
      - mlflow-database:/mlflow/database
      - mlflow-artifacts:/mlflow/artifacts

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:5000/health',
          timeout=5
          )
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

    restart: unless-stopped

    networks:
      - lanala-network

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile

    image: lanala-recommendation-api:latest
    container_name: lanala-api

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: lanala-banking-recommender
      MODEL_ALIAS: ${MODEL_ALIAS:-production}
      TOP_K: "3"

      LABEL_ENCODER_PATH: >-
        /app/model-assets/label_encoder.joblib

      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}

      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"

    volumes:
      - type: bind
        source: ./reports/phase4/label_encoder.joblib
        target: /app/model-assets/label_encoder.joblib
        read_only: true
        bind:
          create_host_path: false
          
      - type: bind
        source: ./reports/monitoring
        target: /app/reports/monitoring
        read_only: true

    depends_on:
      mlflow:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/health',
          timeout=5
          )
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

    restart: unless-stopped

    networks:
      - lanala-network

volumes:
  mlflow-database:
    name: lanala-mlflow-database

  mlflow-artifacts:
    name: lanala-mlflow-artifacts

networks:
  lanala-network:
    name: lanala-network
    driver: bridge