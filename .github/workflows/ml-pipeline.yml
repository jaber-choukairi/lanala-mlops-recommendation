name: LANALA MLOps Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_deployment:
        description: "Déployer le modèle en Staging"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lanala-mlops-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  MODEL_NAME: "lanala-banking-recommender"
  MLFLOW_TRACKING_URI: "http://localhost:5000"

jobs:
  tests:
    name: 1 - Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les tests
        run: |
          python -m pytest -v \
            --ignore=tests/integration/test_staging_api.py \
            --cov=api \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Sauvegarder le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  data-quality:
    name: 2 - Qualité des données
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier Great Expectations
        run: |
          python -c "import great_expectations as gx; print('Version GX :', gx.__version__)"
          python -c "from great_expectations.dataset import PandasDataset; print('PandasDataset OK')"

      - name: Générer, valider et transformer les données
        run: |
          dvc repro split_data

      - name: Sauvegarder les rapports de données
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-reports
          path: |
            reports/data_quality/
          if-no-files-found: warn

  training:
    name: 3 - Entraînement et évaluation
    needs: data-quality
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reproduire les données
        run: |
          dvc repro split_data

      - name: Démarrer MLflow temporaire
        run: |
          mkdir -p mlflow-ci/artifacts

          mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow-ci.db \
            --serve-artifacts \
            --artifacts-destination ./mlflow-ci/artifacts \
            > mlflow-ci.log 2>&1 &

          echo $! > mlflow-ci.pid

      - name: Attendre MLflow
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo ""
              echo "MLflow est disponible."
              exit 0
            fi

            echo "Attente MLflow : ${attempt}/30"
            sleep 2
          done

          echo "MLflow ne répond pas."
          cat mlflow-ci.log
          exit 1

      - name: Entraîner la baseline
        run: |
          python -m pipelines.train_baselines

      - name: Entraîner XGBoost
        run: |
          python -m pipelines.train_xgboost

      - name: Comparer Champion et Challenger
        run: |
          python -m pipelines.compare_champion_challenger

      - name: Appliquer le Quality Gate
        run: |
          python -m pipelines.check_quality_gate

      - name: Sauvegarder les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-reports
          path: |
            reports/phase3/
            reports/phase4/
            reports/phase6/
            mlflow-ci.log
          if-no-files-found: warn

      - name: Afficher les logs MLflow en cas d’échec
        if: failure()
        run: |
          if [ -f mlflow-ci.log ]; then
            cat mlflow-ci.log
          fi

  staging:
    name: 4 - Déploiement Staging
    needs:
      - tests
      - data-quality
      - training

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.run_deployment == true

    runs-on:
      - self-hosted
      - Windows
      - X64

    environment:
      name: staging

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les dépendances
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier Docker
        shell: powershell
        run: |
          docker --version
          docker compose version
          docker compose config

      - name: Démarrer MLflow
        shell: powershell
        run: |
          docker compose up -d mlflow
          docker compose ps

      - name: Attendre MLflow
        shell: powershell
        run: |
          $maximumAttempts = 30
          $mlflowAvailable = $false

          for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
              try {
                  $response = Invoke-WebRequest `
                    -Uri "http://localhost:5000/health" `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "MLflow est disponible."
                      $mlflowAvailable = $true
                      break
                  }
              }
              catch {
                  Write-Host "Attente MLflow : $attempt/$maximumAttempts"
                  Start-Sleep -Seconds 5
              }
          }

          if (-not $mlflowAvailable) {
              docker compose logs mlflow
              throw "MLflow ne répond pas."
          }

      - name: Préparer les données
        shell: powershell
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          dvc repro split_data

      - name: Entraîner et évaluer les modèles
        shell: powershell
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          python -m pipelines.train_baselines
          python -m pipelines.train_xgboost
          python -m pipelines.compare_champion_challenger
          python -m pipelines.check_quality_gate

      - name: Enregistrer le modèle en Staging
        shell: powershell
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          python -m pipelines.register_model

      - name: Vérifier le LabelEncoder
        shell: powershell
        run: |
          $encoderPath = "reports/phase4/label_encoder.joblib"

          if (-not (Test-Path $encoderPath -PathType Leaf)) {
              throw "label_encoder.joblib est absent ou n'est pas un fichier."
          }

          $encoder = Get-Item $encoderPath

          if ($encoder.Length -eq 0) {
              throw "label_encoder.joblib est vide."
          }

          Write-Host "LabelEncoder valide : $($encoder.FullName)"
          Write-Host "Taille : $($encoder.Length) octets"

      - name: Sauvegarder les ressources validées en Staging
        uses: actions/upload-artifact@v4
        with:
          name: staging-serving-assets
          path: reports/phase4/label_encoder.joblib
          if-no-files-found: error
          retention-days: 7

      - name: Construire et démarrer FastAPI Staging
        shell: powershell
        run: |
          $env:MODEL_ALIAS = "staging"
          docker compose up -d --build --force-recreate api
          docker compose ps

      - name: Attendre FastAPI
        shell: powershell
        run: |
          $maximumAttempts = 30
          $apiAvailable = $false

          for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
              try {
                  $health = Invoke-RestMethod `
                    -Uri "http://localhost:8000/health" `
                    -TimeoutSec 5

                  Write-Host ($health | ConvertTo-Json)

                  if (
                      $health.status -eq "healthy" -and
                      $health.model_loaded -eq $true -and
                      $health.model_alias -eq "staging"
                  ) {
                      Write-Host "FastAPI Staging est disponible."
                      $apiAvailable = $true
                      break
                  }
              }
              catch {
                  Write-Host "Attente FastAPI : $attempt/$maximumAttempts"
              }

              Start-Sleep -Seconds 5
          }

          if (-not $apiAvailable) {
              docker compose logs api
              throw "FastAPI Staging n'est pas healthy."
          }

      - name: Tester l’API Staging
        shell: powershell
        run: |
          python -m pytest tests/integration/test_staging_api.py -vv

      - name: Afficher les logs en cas d’échec
        if: failure()
        shell: powershell
        run: |
          docker compose ps
          docker compose logs mlflow --tail=200
          docker compose logs api --tail=200

  production:
    name: 5 - Promotion Production
    needs: staging

    runs-on:
      - self-hosted
      - Windows
      - X64

    environment:
      name: production

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les dépendances
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Nettoyer l’ancien montage incorrect
        shell: powershell
        run: |
          $encoderPath = "reports/phase4/label_encoder.joblib"

          if (Test-Path $encoderPath -PathType Container) {
              Write-Host "Suppression du dossier incorrect : $encoderPath"
              Remove-Item $encoderPath -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "reports/phase4" `
            -Force | Out-Null

      - name: Télécharger les ressources du Staging
        uses: actions/download-artifact@v4
        with:
          name: staging-serving-assets
          path: reports/phase4

      - name: Vérifier les ressources de Production
        shell: powershell
        run: |
          $encoderPath = "reports/phase4/label_encoder.joblib"

          if (-not (Test-Path $encoderPath -PathType Leaf)) {
              Get-ChildItem "reports/phase4" -Recurse
              throw "Le fichier label_encoder.joblib n'a pas été téléchargé."
          }

          $encoder = Get-Item $encoderPath

          Write-Host "Fichier trouvé : $($encoder.FullName)"
          Write-Host "Taille : $($encoder.Length) octets"

          if ($encoder.Length -eq 0) {
              throw "Le LabelEncoder téléchargé est vide."
          }

      - name: Vérifier MLflow
        shell: powershell
        run: |
          docker compose up -d mlflow

          $maximumAttempts = 30
          $mlflowAvailable = $false

          for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
              try {
                  $response = Invoke-WebRequest `
                    -Uri "http://localhost:5000/health" `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      $mlflowAvailable = $true
                      break
                  }
              }
              catch {
                  Start-Sleep -Seconds 5
              }
          }

          if (-not $mlflowAvailable) {
              docker compose logs mlflow
              throw "MLflow ne répond pas."
          }

      - name: Promouvoir Staging vers Production
        shell: powershell
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
          MODEL_NAME: lanala-banking-recommender
        run: |
          $modelVersion = python -c "import os; from mlflow import MlflowClient; client = MlflowClient(); model = client.get_model_version_by_alias(os.environ['MODEL_NAME'], 'staging'); print(model.version)"

          if ($LASTEXITCODE -ne 0) {
              throw "Impossible de récupérer la version portant l'alias staging."
          }

          $modelVersion = ($modelVersion | Select-Object -Last 1).Trim()

          if ([string]::IsNullOrWhiteSpace($modelVersion)) {
              throw "La version MLflow récupérée est vide."
          }

          Write-Host "Version Staging trouvée : $modelVersion"
          Write-Host "Promotion vers Production..."

          python -m pipelines.promote_model `
            --version $modelVersion `
            --to production

          if ($LASTEXITCODE -ne 0) {
              throw "La promotion du modèle vers Production a échoué."
          }

          Write-Host "Version $modelVersion promue en Production."

      - name: Redémarrer FastAPI en Production
        shell: powershell
        run: |
          $env:MODEL_ALIAS = "production"

          docker compose up -d `
            --force-recreate `
            --no-deps `
            api

          if ($LASTEXITCODE -ne 0) {
              throw "Le redémarrage de FastAPI Production a échoué."
          }

          docker compose ps

      - name: Vérifier FastAPI Production
        shell: powershell
        run: |
          $maximumAttempts = 30
          $productionAvailable = $false

          for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
              try {
                  $health = Invoke-RestMethod `
                    -Uri "http://localhost:8000/health" `
                    -TimeoutSec 5

                  Write-Host ($health | ConvertTo-Json)

                  if (
                      $health.status -eq "healthy" -and
                      $health.model_loaded -eq $true -and
                      $health.model_alias -eq "production"
                  ) {
                      Write-Host "FastAPI Production est disponible."
                      $productionAvailable = $true
                      break
                  }
              }
              catch {
                  Write-Host "Attente Production : $attempt/$maximumAttempts"
              }

              Start-Sleep -Seconds 5
          }

          if (-not $productionAvailable) {
              docker compose logs api
              throw "FastAPI Production n'est pas healthy."
          }

      - name: Afficher les logs en cas d’échec
        if: failure()
        shell: powershell
        run: |
          docker compose ps
          docker compose logs mlflow --tail=200
          docker compose logs api --tail=200
  monitoring:
    name: 6 - Monitoring et drift
    needs:
      - production
    runs-on:
      - self-hosted
      - Windows
      - X64

    env:
        MLFLOW_TRACKING_URI: http://localhost:5000
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
        - name: Récupérer le repository
          uses: actions/checkout@v4

        - name: Installer Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.10"
            cache: pip

        - name: Installer les dépendances
          run: python -m pip install -r requirements.txt

        - name: Reproduire les données de référence
          run: |
            python -m pipelines.generate_data
            python -m pipelines.validate_data
            python -m pipelines.feature_engineering
            python -m pipelines.split_data
            python -m monitoring.build_reference_data

        - name: Générer les données récentes simulées
          run: python -m monitoring.generate_recent_data

        - name: Générer le rapport de drift
          run: python -m monitoring.detect_drift

        - name: Évaluer la décision de réentraînement
          run: python -m monitoring.trigger_retraining

        - name: Sauvegarder les rapports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: monitoring-reports
            path: reports/monitoring/
            if-no-files-found: error
            retention-days: 14