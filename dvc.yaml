stages:
  generate_data:
    cmd: python -m pipelines.generate_data
    deps:
      - pipelines/generate_data.py
    params:
      - data_generation.number_of_clients
      - data_generation.random_seed
    outs:
      - data/raw/banking_clients.csv

  validate_data:
    cmd: python -m pipelines.validate_data
    deps:
      - pipelines/validate_data.py
      - data/raw/banking_clients.csv
    params:
      - data_validation.minimum_rows
      - data_validation.maximum_missing_percentage
    metrics:
      - data/validation/validation_report.json:
          cache: false

  preprocess:
    cmd: python -m pipelines.preprocess
    deps:
      - pipelines/preprocess.py
      - data/raw/banking_clients.csv
      - data/validation/validation_report.json
    params:
      - preprocessing.minimum_age
      - preprocessing.maximum_age
      - preprocessing.minimum_income
      - preprocessing.maximum_income
    outs:
      - data/interim/banking_clients_clean.csv

  build_features:
    cmd: python -m pipelines.build_features
    deps:
      - pipelines/build_features.py
      - data/interim/banking_clients_clean.csv
    outs:
      - data/processed/banking_clients_processed.parquet
      - data/features/client_features.parquet

  split_data:
    cmd: python -m pipelines.split_data
    deps:
      - pipelines/split_data.py
      - data/features/client_features.parquet
    params:
      - data_split.random_seed
      - data_split.train_size
      - data_split.validation_size
      - data_split.test_size
    outs:
      - data/splits/train.parquet
      - data/splits/validation.parquet
      - data/splits/test.parquet

  train_baselines:
    cmd: python -m pipelines.train_baselines
    deps:
      - pipelines/train_baselines.py
      - src/models/metrics.py
      - data/features/client_features.parquet
      - data/splits/train.parquet
      - data/splits/validation.parquet
      - data/splits/test.parquet
    params:
      - baseline.experiment_name
      - baseline.tracking_uri
      - baseline.top_k
      - baseline.logistic_regression.max_iter
      - baseline.logistic_regression.class_weight
      - baseline.logistic_regression.solver
      - baseline.logistic_regression.random_seed
    metrics:
      - reports/phase3/summary.json:
          cache: false